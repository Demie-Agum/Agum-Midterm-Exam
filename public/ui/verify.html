<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Verify Account</title>
  <link rel="stylesheet" href="/ui/assets/style.css"/>
</head>
<body>
<div class="container">
  <div class="nav">
    <a class="logo" href="/ui/">📒 Phonebook</a>
    <a href="/ui/login.html">Login</a>
  </div>
  <div class="card" style="max-width:560px;margin:0 auto;">
    <h2>Verify your account</h2>
    <p class="helper">Demo-only UI. Backend endpoints for OTP/email link are not implemented in this sample API, but this page shows the intended flow.</p>

    <h3>Verify via OTP</h3>
    <div class="row">
      <div class="input" style="flex:1">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com"/>
      </div>
      <div class="input" style="flex:1">
        <label>OTP</label>
        <input id="otp" placeholder="123456"/>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="btnSendOtp">Send OTP</button>
      <button class="btn secondary" id="btnVerifyOtp">Verify OTP</button>
    </div>

    <h3 style="margin-top:24px;">Verify via Link</h3>
    <div class="input">
      <label>Verification link token</label>
      <input id="link_token" placeholder="token from email link"/>
    </div>
    <button class="btn" id="btnVerifyLink">Verify Link</button>
  </div>
</div>
<script src="/ui/assets/app.js"></script>
<script>
// Demo UX only
$('#btnSendOtp').addEventListener('click', ()=> toast('OTP sent (demo)'))
$('#btnVerifyOtp').addEventListener('click', ()=> toast('OTP verified (demo)'))
$('#btnVerifyLink').addEventListener('click', ()=> toast('Link verified (demo)'))
</script>
</body>
</html>
