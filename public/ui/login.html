<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login</title>
  <link rel="stylesheet" href="/ui/assets/style.css"/>
</head>
<body>
<div class="container">
  <div class="nav">
    <a class="logo" href="/ui/">📒 Phonebook</a>
    <a href="/ui/register.html">Register</a>
  </div>
  <div class="card" style="max-width:420px;margin:0 auto;">
    <h2>Login</h2>
    <div class="input">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com"/>
    </div>
    <div class="input">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••"/>
    </div>
    <div class="row" style="justify-content:space-between;align-items:center;">
      <button class="btn" id="btnLogin">Login</button>
      <a class="helper" href="/ui/forgot.html">Forgot password?</a>
    </div>
  </div>
</div>
<script src="/ui/assets/app.js"></script>
<script>
$('#btnLogin').addEventListener('click', async () => {
  const email = $('#email').value.trim();
  const password = $('#password').value;
  try{
    const res = await request('/auth/login', {method:'POST', body:{email, password}});
    saveToken(res.access_token);
    toast('Logged in');
    location.href = '/ui/contacts.html';
  }catch(e){ toast(e.data && e.data.error ? e.data.error : 'Login failed'); }
});
</script>
</body>
</html>
