<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/ui/assets/style.css"/>
</head>
<body>
<div class="container">
  <div class="nav">
    <a class="logo" href="/ui/">📒 Phonebook</a>
    <a href="/ui/login.html">Login</a>
  </div>
  <div class="card" style="max-width:560px;margin:0 auto;">
    <h2>Forgot Password</h2>
    <p class="helper">Demo-only UI. Backend endpoints for OTP reset are not implemented in this sample API.</p>

    <h3>Request OTP</h3>
    <div class="input">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com"/>
    </div>
    <button class="btn" id="btnRequestOtp">Send OTP</button>

    <h3 style="margin-top:24px;">Reset Password</h3>
    <div class="row">
      <div class="input" style="flex:1">
        <label>OTP</label>
        <input id="otp" placeholder="123456"/>
      </div>
      <div class="input" style="flex:1">
        <label>New Password</label>
        <input id="new_password" type="password" placeholder="••••••••"/>
      </div>
    </div>
    <button class="btn secondary" id="btnReset">Reset Password</button>
  </div>
</div>
<script src="/ui/assets/app.js"></script>
<script>
$('#btnRequestOtp').addEventListener('click', ()=> toast('OTP sent (demo)'))
$('#btnReset').addEventListener('click', ()=> toast('Password reset (demo)'))
</script>
</body>
</html>
